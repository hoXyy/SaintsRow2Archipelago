name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_call:

jobs:
    lint-apworld:
        name: Lint APWorld
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Run Ruff linter
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  version: "0.17.1"
                  src: apworld

            - name: Check formatting
              run: ruff format --check --diff apworld

    test-apworld:
        name: Test APWorld
        runs-on: ubuntu-latest

        steps:
            - name: Run tests
              uses: Eijebong/ap-actions/ap-tests@main
              with:
                  apworld-path: apworld
                  apworld-name: saints_row_2
                  ap-version: "0.6.8"
                  python-version: "3.12"

    fuzz-apworld:
        name: Fuzz APWorld
        runs-on: ubuntu-latest

        steps:
            - name: Run fuzzer
              uses: Eijebong/ap-actions/fuzz@main
              with:
                  apworld-path: apworld
                  apworld-name: saints_row_2
                  ap-version: "0.6.8"
                  python-version: "3.12"
                  runs: 1000
                  yamls-per-run: 1-6

    test-plugin:
        name: Test game integration plugin
        runs-on: windows-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Setup MSVC
              uses: TheMrMilchmann/setup-msvc-dev@v4
              with:
                  arch: x86

            - name: Install make
              run: choco install make --no-progress -y

            - name: Install Rust x86 target
              run: rustup target add i686-pc-windows-msvc

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: game_plugin/rust -> ../build/cargo-target

            - name: Run tests
              working-directory: game_plugin
              run: make test