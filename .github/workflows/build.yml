name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to embed in the game plugin. Defaults to dev-<commit sha>.
        type: string
        default: ""

jobs:
  build-plugin:
    runs-on: windows-latest
    name: Build game integration plugin

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x86
      - name: Install make
        run: choco install make
      - name: Install Rust x86 target
        run: rustup target add i686-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: game_plugin/rust -> ../build-ci/cargo-target
      - name: Build
        run: cd game_plugin && make BUILD_DIR=build-ci PROJECT_VERSION=${{ inputs.version || format('dev-{0}', github.sha) }}
      - name: Download ASI loader
        run: |
          Invoke-WebRequest -Uri "https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/Win32-latest/dinput8-Win32.zip" -OutFile "dinput8.zip"
          Expand-Archive -Path ".\dinput8.zip" -DestinationPath "asi-loader"
      - name: Prepare output archive
        run: |
          mkdir output
          mkdir output/scripts
          mkdir output/Mods
          cp asi-loader/dinput8.dll output/dinput8.dll
          cp game_plugin/build-ci/SR2Archipelago.asi output/scripts/SR2Archipelago.asi
          cp game_plugin/config/SR2Archipelago.toml.example output/scripts/SR2Archipelago.toml
          cp -r modded_game_files/sr2ap_core_files output/Mods/sr2ap_core_files
          cp -r modded_game_files/sr2ap_seed_files output/Mods/sr2ap_seed_files
      - name: Create zip file
        run: powershell Compress-Archive -Path output/* -DestinationPath SR2Archipelago.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SR2Archipelago.zip
          path: SR2Archipelago.zip
          archive: false

  build-apworld:
    name: Build APWorld
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Checkout Archipelago repo
        uses: actions/checkout@v7
        with:
          repository: ArchipelagoMW/Archipelago
          ref: 0.6.8
          path: Archipelago
      - name: Install Archipelago dependencies
        run: |
          python Archipelago/ModuleUpdate.py --yes
      - name: Prepare APWorld folder in launcher files
        run: |
          mkdir Archipelago/worlds/saints_row_2
          cp -r apworld/* Archipelago/worlds/saints_row_2/
      - name: Build APWorld
        run: cd Archipelago && SKIP_REQUIREMENTS_UPDATE=1 python Launcher.py "Build APWorlds" -- "Saints Row 2"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: saints_row_2.apworld
          path: Archipelago/build/apworlds/saints_row_2.apworld
          archive: false

  package-collectible-maps:
    name: Package collectible maps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Create archive
        run: |
          cd docs && zip -r collectible_maps.zip collectible_maps
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: collectible_maps.zip
          path: docs/collectible_maps.zip
          archive: false
