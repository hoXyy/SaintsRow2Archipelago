[package]
name = "sr2ap-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cxx = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1.4"

[build-dependencies]
cxx-build = "1"
