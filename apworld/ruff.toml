target-version = "py311"
line-length = 88

[format]
docstring-code-format = true

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PERF", "RUF"]
ignore = [
    "E501",  
    "RUF012",
    "SIM108",
]

[lint.per-file-ignores]
"test/**" = ["B011", "PERF"]

[lint.isort]
section-order = ["future", "standard-library", "third-party", "archipelago", "first-party", "local-folder"]

[lint.isort.sections]
archipelago = [
    "worlds", "BaseClasses", "Options", "CommonClient", "NetUtils", "Utils",
    "Fill", "Generate", "settings", "MultiServer", "ModuleUpdate", "kvui", "test",
]